
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YTR - YouTube Türkiye</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f9f9f9;
    color: #0f0f0f;
}

/* ÜST MENÜ */
.header {
    height: 65px;
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 20px;
    background: white;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid #eee;
}

/* YTR ÜST LOGO */
.ytr-logo {
    display: flex;
    align-items: center;
    gap: 7px;
    cursor: pointer;
}

.ytr-icon {
    width: 42px;
    height: 30px;
    background: #ff0000;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.ytr-icon::after {
    content: "";
    width: 0;
    height: 0;
    border-top: 7px solid transparent;
    border-bottom: 7px solid transparent;
    border-left: 12px solid white;
    margin-left: 3px;
}

.ytr-text {
    font-size: 25px;
    font-weight: bold;
    letter-spacing: -1.5px;
}

/* ARAMA */
.search {
    display: flex;
    margin-left: auto;
    width: 50%;
    max-width: 600px;
}

.search input {
    flex: 1;
    min-width: 0;
    height: 40px;
    border: 1px solid #ccc;
    border-radius: 25px 0 0 25px;
    padding: 0 15px;
    font-size: 16px;
    outline: none;
}

.search button {
    width: 60px;
    background: #f5f5f5;
    border: 1px solid #ccc;
    border-radius: 0 25px 25px 0;
    font-size: 20px;
    cursor: pointer;
}

.user {
    background: white;
    border: 1px solid #065fd4;
    color: #065fd4;
    padding: 9px 15px;
    border-radius: 20px;
    cursor: pointer;
}

/* KATEGORİLER */
.categories {
    display: flex;
    gap: 10px;
    padding: 15px;
    overflow-x: auto;
    white-space: nowrap;
}

.category {
    background: #eee;
    padding: 9px 15px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
}

.category.active {
    background: #222;
    color: white;
}

/* ANA SAYFA */
.content {
    padding: 20px;
}

.content h2 {
    font-size: 22px;
    margin-bottom: 20px;
}

/* VİDEO LİSTESİ */
.video-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px 18px;
}

/* VİDEO KARTI */
.video {
    cursor: pointer;
}

/* KÜÇÜK RESİM */
.thumbnail {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #ddd;
    overflow: hidden;
    border-radius: 12px;
}

.thumbnail img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* VİDEO ÜZERİNDE YTR LOGOSU */
.video-logo {
    position: absolute;
    top: 10px;
    left: 10px;
    background: #ff0000;
    color: white;
    font-size: 16px;
    font-weight: bold;
    padding: 5px 8px;
    border-radius: 5px;
    z-index: 2;
}

/* VİDEO SÜRESİ */
.duration {
    position: absolute;
    bottom: 8px;
    right: 8px;
    background: rgba(0, 0, 0, 0.85);
    color: white;
    font-size: 12px;
    padding: 3px 5px;
    border-radius: 4px;
}

/* VİDEO BİLGİLERİ */
.video-info {
    display: flex;
    gap: 10px;
    margin-top: 12px;
}

/* KANAL LOGOSU */
.channel-logo {
    width: 36px;
    height: 36px;
    min-width: 36px;
    background: #ff0000;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.channel-logo::after {
    content: "";
    width: 0;
    height: 0;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
    border-left: 10px solid white;
    margin-left: 3px;
}

/* BAŞLIK */
.video-text {
    flex: 1;
}

.video-text h3 {
    font-size: 15px;
    line-height: 1.4;
    margin-bottom: 6px;
}

/* KANAL */
.channel-info {
    font-size: 12px;
    color: #606060;
    margin-bottom: 4px;
}

/* GÖRÜNTÜLEME */
.video-stats {
    font-size: 12px;
    color: #606060;
}

/* MOBİL */
@media (max-width: 900px) {
    .video-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 600px) {

    .header {
        padding: 0 10px;
        gap: 10px;
    }

    .ytr-text {
        font-size: 21px;
    }

    .ytr-icon {
        width: 35px;
        height: 26px;
    }

    .user {
        display: none;
    }

    .content {
        padding: 12px;
    }

    .video-grid {
        grid-template-columns: 1fr;
        gap: 25px;
    }

    .thumbnail {
        border-radius: 10px;
    }
}
</style>
</head>

<body>

<!-- ÜST MENÜ -->
<header class="header">

    <div class="ytr-logo">
        <div class="ytr-icon"></div>
        <span class="ytr-text">YTR</span>
    </div>

    <!-- ARAMA -->
    <form class="search" onsubmit="arama(event)">
        <input type="text" id="aramaKutusu" placeholder="Ara">
        <button type="submit">⌕</button>
    </form>

    <button class="user">Giriş yap</button>

</header>

<!-- KATEGORİLER -->
<nav class="categories">
    <div class="category active">Tümü</div>
    <div class="category">Müzik</div>
    <div class="category">Oyun</div>
    <div class="category">Canlı</div>
    <div class="category">Filmler</div>
    <div class="category">Haberler</div>
    <div class="category">Eğitim</div>
</nav>

<!-- ANA İÇERİK -->
<main class="content">

    <h2>Videolar</h2>

    <div class="video-grid">

        <!-- VIDEO 1 -->
        <div class="video">

            <div class="thumbnail">

                <img src="video1.jpg" alt="Video resmi">

                <div class="video-logo">YTR</div>

                <div class="duration">10:25</div>

            </div>

            <div class="video-info">

                <div class="channel-logo"></div>

                <div class="video-text">

                    <h3>YTR Türkiye'ye Hoş Geldiniz!</h3>

                    <div class="channel-info">
                        YTR
                    </div>

                    <div class="video-stats">
                        1,2 B görüntüleme • 2 gün önce
                    </div>

                </div>

            </div>

        </div>

        <!-- VIDEO 2 -->
        <div class="video">

            <div class="thumbnail">

                <img src="video2.jpg" alt="Video resmi">

                <div class="video-logo">YTR</div>

                <div class="duration">08:14</div>

            </div>

            <div class="video-info">

                <div class="channel-logo"></div>

                <div class="video-text">

                    <h3>Türkiye'nin Yeni Video Platformu</h3>

                    <div class="channel-info">
                        YTR
                    </div>

                    <div class="video-stats">
                        850 görüntüleme • 1 gün önce
                    </div>

                </div>

            </div>

        </div>

        <!-- VIDEO 3 -->
        <div class="video">

            <div class="thumbnail">

                <img src="video3.jpg" alt="Video resmi">

                <div class="video-logo">YTR</div>

                <div class="duration">15:30</div>

            </div>

            <div class="video-info">

                <div class="channel-logo"></div>

                <div class="video-text">

                    <h3>Yeni Videolar Burada!</h3>

                    <div class="channel-info">
                        YTR
                    </div>

                    <div class="video-stats">
                        500 görüntüleme • 3 gün önce
                    </div>

                </div>

            </div>

        </div>

    </div>

</main>

<script>

/* ARAMA */
function arama(event) {
    event.preventDefault();

    const kelime = document.getElementById("aramaKutusu").value.trim();

    if (kelime !== "") {
        alert("YTR arama: " + kelime);
    }
}

/* KATEGORİ SEÇİMİ */
document.querySelectorAll(".category").forEach(function(kategori) {

    kategori.addEventListener("click", function() {

        document.querySelectorAll(".category").forEach(function(k) {
            k.classList.remove("active");
        });

        kategori.classList.add("active");

    });

});

</script>

</body>
  </html>
