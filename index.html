
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YouTube - Page Error</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f1f1f1;
    font-family: Arial, Helvetica, sans-serif;
    color: #333;
}

.page {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.content {
    width: 100%;
    max-width: 650px;
    text-align: center;
    padding: 20px;
    transform: translateY(-20px);
}

/* Monkey */
.monkey {
    width: 220px;
    height: auto;
    display: block;
    margin: auto;
}

/* Mesaj */
.message {
    font-size: 18px;
    line-height: 1.4;
    margin-top: 5px;
}

/* Logo ve arama */
.search-area {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: 30px;
    flex-wrap: nowrap;
}

.youtube-logo {
    display: flex;
    align-items: flex-start;
    margin-right: 15px;
    position: relative;
    top: -8px;
}

.youtube-logo img {
    width: 170px;
    height: auto;
}

.tr {
    font-size: 11px;
    color: #167ac6;
    margin-left: 3px;
    margin-top: 5px;
}

/* Arama kutusu */
.search {
    display: flex;
    height: 36px;
    width: 350px;
    max-width: 50vw;
}

.search input {
    flex: 1;
    min-width: 0;
    border: 1px solid #ccc;
    padding: 8px;
    font-size: 16px;
    outline: none;
    background: white;
}

.search input:focus {
    border-color: #888;
}

.search button {
    width: 80px;
    border: 1px solid #ccc;
    background: #f8f8f8;
    color: #777;
    font-size: 18px;
    cursor: pointer;
}

.search button:hover {
    background: #e8e8e8;
}

/* Mobil */
@media (max-width: 500px) {
    .monkey {
        width: 220px;
    }

    .message {
        font-size: 16px;
    }

    .search-area {
        flex-wrap: wrap;
        gap: 15px;
    }

    .youtube-logo {
        margin-right: 0;
    }

    .search {
        width: 100%;
        max-width: 100%;
    }
}
</style>
</head>

<body>

<div class="page">
    <div class="content">

        <!-- YouTube Monkey -->
        <img
            src="https://www.gstatic.com/youtube/src/web/htdocs/img/monkey.png"
            class="monkey"
            alt="Monkey"
        >

        <!-- Hata mesajı -->
        <div class="message" id="message"></div>

        <!-- Logo ve arama -->
        <div class="search-area">

            <div class="youtube-logo">
                <img
                    src="https://i.ibb.co/Tp2S1sj/1000032916.png"
                    alt="YouTube"
                >
                <span class="tr" id="region"></span>
            </div>

            <form
                class="search"
                action="https://www.youtube.com/results"
                method="GET"
            >
                <input
                    type="text"
                    name="search_query"
                    id="searchInput"
                    placeholder="Search"
                >

                <button type="submit">⌕</button>
            </form>

        </div>

    </div>
</div>

<script>

/* Dil sistemi */

const languages = {

    tr: {
        title: "YouTube - Sayfa Kullanılamıyor",
        message: "Bu sayfa kullanılamıyor. Özür dileriz.<br>Başka bir şey aramayı deneyin.",
        search: "Ara",
        region: "TR"
    },

    en: {
        title: "YouTube - Page Unavailable",
        message: "This page isn't available. Sorry about that.<br>Try searching for something else.",
        search: "Search",
        region: "US"
    },

    de: {
        title: "YouTube - Seite nicht verfügbar",
        message: "Diese Seite ist nicht verfügbar. Es tut uns leid.<br>Versuchen Sie, nach etwas anderem zu suchen.",
        search: "Suchen",
        region: "DE"
    },

    fr: {
        title: "YouTube - Page indisponible",
        message: "Cette page n'est pas disponible. Désolé.<br>Essayez de rechercher autre chose.",
        search: "Rechercher",
        region: "FR"
    },

    es: {
        title: "YouTube - Página no disponible",
        message: "Esta página no está disponible. Lo sentimos.<br>Prueba a buscar otra cosa.",
        search: "Buscar",
        region: "ES"
    },

    ru: {
        title: "YouTube - Страница недоступна",
        message: "Эта страница недоступна. Извините.<br>Попробуйте поискать что-нибудь другое.",
        search: "Поиск",
        region: "RU"
    },

    it: {
        title: "YouTube - Pagina non disponibile",
        message: "Questa pagina non è disponibile. Ci dispiace.<br>Prova a cercare qualcos'altro.",
        search: "Cerca",
        region: "IT"
    },

    pt: {
        title: "YouTube - Página indisponível",
        message: "Esta página não está disponível. Desculpe.<br>Tente pesquisar outra coisa.",
        search: "Pesquisar",
        region: "PT"
    },

    nl: {
        title: "YouTube - Pagina niet beschikbaar",
        message: "Deze pagina is niet beschikbaar. Sorry.<br>Probeer iets anders te zoeken.",
        search: "Zoeken",
        region: "NL"
    },

    ja: {
        title: "YouTube - ページを利用できません",
        message: "このページは利用できません。申し訳ありません。<br>別のものを検索してみてください。",
        search: "検索",
        region: "JP"
    },

    ko: {
        title: "YouTube - 페이지를 사용할 수 없습니다",
        message: "이 페이지를 사용할 수 없습니다. 죄송합니다.<br>다른 항목을 검색해 보세요.",
        search: "검색",
        region: "KR"
    },

    ar: {
        title: "YouTube - الصفحة غير متاحة",
        message: "هذه الصفحة غير متاحة. نعتذر عن ذلك.<br>حاول البحث عن شيء آخر.",
        search: "بحث",
        region: "SA"
    },

    zh: {
        title: "YouTube - 页面无法使用",
        message: "此页面无法使用。很抱歉。<br>请尝试搜索其他内容。",
        search: "搜索",
        region: "CN"
    }
};

/* Tarayıcı dilini bul */

const browserLanguage =
    (navigator.languages?.[0] ||
     navigator.language ||
     "en").toLowerCase().split("-")[0];

/* Dil seçimi */

const lang = languages[browserLanguage] || languages.en;

/* Sayfaya uygula */

document.documentElement.lang = browserLanguage;

document.title = lang.title;

document.getElementById("message").innerHTML =
    lang.message;

document.getElementById("searchInput").placeholder =
    lang.search;

document.getElementById("region").textContent =
    lang.region;

</script>

</body>
  </html>
